<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.jpg" />
    <link rel="stylesheet" href="./style.css" />
    
  </head>
  <body>
    <header>
      <div class="header">
        <img class="taskflowicon" src="/assets/TF icon.jpg" />
        <h1>TaskFlow</h1>
      </div>
    </header>
    <main>
      <section>
        <h2>My Tasks</h2>
        <form>
          <input class="task-input" type="text" placeholder="Enter your task" />
          <button type="submit">Add Task</button>
        </form>
        <div class="task-list">
          <h3>Task List</h3>
          <div>
            <div class="tasklistcard">
              <input type="checkbox" />
              <span>Complete HTML Structure</span>
            </div>
            <div class="tasklistcard">
              <input type="checkbox" />
              <span>Learn JavaScript DOM</span>
            </div>
            <div class="tasklistcard">
              <input type="checkbox" />
              <span>Build TaskFlow Project</span>
            </div>
          </div>
        </div>
        <p class="warning-message">Please enter a task!</p>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
